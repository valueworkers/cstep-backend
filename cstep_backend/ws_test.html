<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics WebSocket Test</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>

<style>
    body {
        font-family: monospace;
        max-width: 700px;
        margin: 40px auto;
    }

    fieldset {
        margin-bottom: 16px;
    }

    legend {
        font-weight: bold;
    }

    label {
        display: block;
        margin-top: 10px;
        font-size: 13px;
    }

    input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        margin-top: 4px;
    }

    button {
        margin-top: 15px;
        padding: 10px 18px;
        cursor: pointer;
        margin-right: 10px;
    }

    .status {
        font-weight: bold;
    }

    .connected {
        color: green;
    }

    .connecting {
        color: orange;
    }

    .disconnected {
        color: red;
    }

    #log {
        background: #111;
        color: #0f0;
        padding: 12px;
        height: 350px;
        overflow-y: auto;
        white-space: pre-wrap;
        margin-top: 20px;
        border-radius: 6px;
    }
</style>
</head>
<body>

<h2>Analytics WebSocket Test</h2>

<fieldset>
    <legend>Connection</legend>

    <label>WebSocket Host</label>
    <input id="host" value="127.0.0.1:8000">

    <label>Event ID</label>
    <input id="eventId" placeholder="Enter Event ID">

    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" disabled>Disconnect</button>
</fieldset>

<p>Status:
    <span id="status" class="status disconnected">Disconnected</span>
</p>

<div id="log"></div>

<script>
const API_HOST = "127.0.0.1:8000";
const LOGIN_URL = "/auth/login/";

const USERNAME = "admin@admin.com";
const PASSWORD = "admin";

let ws = null;
let accessToken = "";

const connectBtn = document.getElementById("connectBtn");
const disconnectBtn = document.getElementById("disconnectBtn");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");

function log(message) {
    const time = new Date().toLocaleTimeString();
    logEl.textContent += `[${time}] ${message}\n`;
    logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = "status " + cls;
}

async function login() {

    if (accessToken !== "") {
        return true;
    }

    const url = `http://${API_HOST}${LOGIN_URL}`;

    log("Logging in...");

    try {

        const response = await axios.post(
            url,
            {
                username: USERNAME,
                password: PASSWORD
            },
            {
                headers: {
                    "Content-Type": "application/json"
                }
            }
        );

        console.log(response.data);

        // Change these if your API response is different
        accessToken =
            response.data?.tokens?.access ||
            response.data?.access ||
            response.data?.token?.access;

        if (!accessToken) {
            log("Login succeeded but no access token found.");
            return false;
        }

        log("JWT token acquired.");
        return true;

    } catch (err) {

        if (err.response) {
            log("Login failed:");
            log(JSON.stringify(err.response.data));
        } else {
            log(err.message);
        }

        return false;
    }
}

connectBtn.onclick = async function () {

    const host = document.getElementById("host").value.trim();
    const eventId = document.getElementById("eventId").value.trim();

    if (!eventId) {
        alert("Enter Event ID");
        return;
    }

    connectBtn.disabled = true;

    setStatus("Logging In...", "connecting");

    const ok = await login();

    if (!ok) {
        connectBtn.disabled = false;
        setStatus("Disconnected", "disconnected");
        return;
    }

    const wsUrl = `ws://${host}/ws/analytics/${eventId}/?token=${accessToken}`;

    log("");
    log("-----------------------------------------");
    log("Connecting...");
    log(wsUrl);
    log("-----------------------------------------");

    setStatus("Connecting...", "connecting");

    ws = new WebSocket(wsUrl);

    ws.onopen = function () {
        log("WebSocket Connected");
        setStatus("Connected", "connected");
        disconnectBtn.disabled = false;
    };

    ws.onmessage = function (event) {
        log("Received:");
        log(event.data);
    };

    ws.onerror = function (event) {
        log("WebSocket Error");
        console.error(event);
    };

    ws.onclose = function (event) {
        log(`Connection Closed`);
        log(`Code: ${event.code}`);
        log(`Reason: ${event.reason || "(none)"}`);

        setStatus("Disconnected", "disconnected");

        connectBtn.disabled = false;
        disconnectBtn.disabled = true;

        ws = null;
    };
};

disconnectBtn.onclick = function () {

    if (ws) {
        ws.close();
    }
};
</script>

</body>
</html>
